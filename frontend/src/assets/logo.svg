<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="DeepMirror">
  <defs>
    <linearGradient id="dm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#dm-bg)"/>
  <!-- A mirror: you on the left (solid), your clone on the right (its outline, carrying a voice wave). -->
  <path d="M30 13a19 19 0 0 0 0 38z" fill="#fff"/>
  <path d="M34 13a19 19 0 0 1 0 38z" fill="none" stroke="#fff" stroke-width="3.4" stroke-linejoin="round"/>
  <g stroke="#fff" stroke-width="2.6" stroke-linecap="round">
    <line x1="40" y1="28" x2="40" y2="36"/>
    <line x1="45" y1="25" x2="45" y2="39"/>
  </g>
</svg>
