<!DOCTYPE html>
<!-- The theme lives in data-theme (set below before first paint); a static
     class="dark" here would claim dark even while the light theme is active. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Realtime voice and face cloning" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/logo.svg" />
    <title>VoxClone</title>
    <script>
      // Applies the saved theme before first paint so a stored light theme
      // never flashes dark on load. Mirrors normalizeTheme() in
      // src/lib/theme.js — keep the two in sync. Anything missing or corrupt
      // falls back to dark, which is the product default.
      (function () {
        var theme = 'dark';
        try {
          var saved = window.localStorage.getItem('ovc_theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
        } catch (err) {
          /* storage blocked — keep the default */
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
