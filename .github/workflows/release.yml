name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Require a commit from main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v7
      - name: Test and build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Test the backend
        run: |
          uv sync --locked --extra cpu --extra neural-f0
          uv run pytest
      - name: Package sources with the built UI
        run: uv run python scripts/package_release.py --check-tag "$GITHUB_REF_NAME"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" tmp/releases/* --verify-tag --title "DeepMirror $GITHUB_REF_NAME" --generate-notes --draft
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
